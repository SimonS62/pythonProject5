{% extends 'base.html' %}
{% load static %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Система рекомендаций</h1>
    <p>Введите свои предпочтения, чтобы получить рекомендации.</p>

    <form id="preference-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="user-select">Выберите пользователя:</label>
            <select class="form-control" id="user-select" name="user_id">
                {% for user in users %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="item-select">Выберите элемент:</label>
            <select class="form-control" id="item-select" name="item_id">
                {% for item in items %}
                    <option value="{{ item.id }}">{{ item.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="interaction-type">Тип взаимодействия:</label>
            <select class="form-control" id="interaction-type" name="interaction_type">
                <option value="view">Просмотр</option>
                <option value="rate">Оценка</option>
                <option value="purchase">Покупка</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Добавить предпочтение</button>
    </form>

    <h2 class="mt-4">Ваши рекомендации:</h2>
    <div id="recommendations-list">
        <p>Выберите пользователя, чтобы увидеть рекомендации.</p>
    </div>
</div>

<style>
    #recommendations-list {
        min-height: 100px;
    }
    .list-group-item {
        transition: all 0.3s ease;
    }
    .list-group-item:hover {
        background-color: #f8f9fa;
        transform: translateX(5px);
    }
    .spinner-border {
        display: block;
        margin: 20px auto;
    }
</style>

<script>
document.getElementById('preference-form').onsubmit = async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    try {
        const response = await fetch("{% url 'api_add_preference' %}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': formData.get('csrfmiddlewaretoken')
            }
        });
        const result = await response.json();

        if (response.ok) {
            // Показываем сообщение об успехе
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-success alert-dismissible fade show mt-3';
            alertDiv.innerHTML = `
                <strong>✅ Успешно!</strong> ${result.message || 'Предпочтение добавлено'}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.querySelector('.container').insertBefore(alertDiv, document.getElementById('recommendations-list'));

            // Автоматически удаляем сообщение через 3 секунды
            setTimeout(() => alertDiv.remove(), 3000);

            // Обновляем рекомендации
            const userId = document.getElementById('user-select').value;
            fetchRecommendations(userId);
        } else {
            alert("❌ Ошибка: " + (result.error || "Неизвестная ошибка"));
        }
    } catch (error) {
        console.error("Error adding preference:", error);
        alert("❌ Ошибка соединения с сервером");
    }
};

async function fetchRecommendations(userId) {
    const recommendationsDiv = document.getElementById('recommendations-list');

    // Показываем индикатор загрузки
    recommendationsDiv.innerHTML = `
        <div class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2 text-muted">Загружаем рекомендации...</p>
        </div>
    `;

    try {
        const response = await fetch(`/api/recommendations/${userId}/`);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Ошибка сервера');
        }

        recommendationsDiv.innerHTML = ''; // Очищаем

        // Используем data.items (названия элементов)
        if (data.items && data.items.length > 0) {
            // Заголовок
            const title = document.createElement('h5');
            title.className = 'mb-3';
            title.textContent = `🎯 Рекомендовано для вас (${data.items.length}):`;
            recommendationsDiv.appendChild(title);

            // Список
            const ul = document.createElement('ul');
            ul.className = 'list-group';

           data.items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                // Исправлено: теперь берем item.name и item.id напрямую
                li.innerHTML = `
                    <span>📌 <strong>${item.name}</strong></span>
                    <small class="text-muted">ID: ${item.id}</small>
                `;
                ul.appendChild(li);
            });

            recommendationsDiv.appendChild(ul);

            // Добавляем кнопку для обновления
            const refreshBtn = document.createElement('button');
            refreshBtn.className = 'btn btn-outline-secondary btn-sm mt-3';
            refreshBtn.innerHTML = '🔄 Обновить';
            refreshBtn.onclick = () => fetchRecommendations(userId);
            recommendationsDiv.appendChild(refreshBtn);

        } else {
            recommendationsDiv.innerHTML = `
                <div class="alert alert-info">
                    <strong>💡 Нет рекомендаций</strong><br>
                    Попробуйте добавить больше взаимодействий с элементами для получения персонализированных рекомендаций.
                </div>
            `;
        }
    } catch (error) {
        recommendationsDiv.innerHTML = `
            <div class="alert alert-danger">
                <strong>❌ Ошибка загрузки</strong><br>
                ${error.message}<br>
                <small>Проверьте подключение к серверу и попробуйте снова.</small>
            </div>
        `;
        console.error('Error fetching recommendations:', error);
    }
}

// Автоматическая загрузка при выборе пользователя
document.getElementById('user-select').addEventListener('change', function() {
    fetchRecommendations(this.value);
});

// Загрузка рекомендаций при загрузке страницы для первого пользователя
document.addEventListener('DOMContentLoaded', function() {
    const initialUser = document.getElementById('user-select').value;
    if (initialUser) {
        fetchRecommendations(initialUser);
    }
});
</script>
{% endblock %}
